<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>واجهة دخول ديسكورد | SLS Freeroom</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal&display=swap');
  body {
    margin: 0; padding: 0;
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    background: radial-gradient(circle, #2a2e47 1px, transparent 1px), #23254a;
    background-size: 50px 50px;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
  }
  .login-container {
    background: #2f3136;
    width: 400px;
    padding: 30px 20px;
    border-radius: 8px;
    box-shadow: 0 0 20px #7289daaa;
    display: flex;
    gap: 20px;
  }
  .login-form {
    flex: 2;
  }
  .login-form h2 {
    margin-bottom: 10px;
    font-weight: 700;
    font-size: 20px;
  }
  .login-form small {
    color: #72767d;
  }
  label {
    display: block;
    margin: 15px 0 5px;
    font-size: 13px;
    color: #b9bbbe;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: #202225;
    border: none;
    border-radius: 3px;
    padding: 10px;
    color: white;
    font-size: 14px;
  }
  input::placeholder {
    color: #72767d;
  }
  button {
    margin-top: 20px;
    width: 100%;
    background-color: #5865f2;
    border: none;
    border-radius: 4px;
    color: white;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background-color: #4752c4;
  }
  .qr-section {
    flex: 1;
    background: #36393f;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
    font-size: 12px;
    color: #b9bbbe;
  }
  .qr-section img {
    width: 100px;
    height: 100px;
    margin-bottom: 10px;
  }
  .qr-section h4 {
    margin: 8px 0 4px;
  }
</style>
</head>
<body>
<div class="login-container" id="loginPage">
  <form class="login-form" id="loginForm">
    <h2>Welcome back!</h2>
    <small>We're so excited to see you again!</small>
    <label for="email">Email or Phone Number</label>
    <input type="text" id="email" placeholder="Email or Phone Number" required />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Log In</button>
  </form>
  <div class="qr-section">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/QR_Code.svg/1024px-QR_Code.svg.png" alt="QR Code" />
    <h4>Log in with QR Code</h4>
    <small>Scan this with the Discord mobile app to log in instantly.</small>
  </div>
</div>

<div id="sitePage" style="display:none;">
  <!-- هنا يدخل كود صفحة الموقع بعد تسجيل الدخول -->
  <h1 style="text-align:center; margin-top:30vh; color:white;">مرحبًا بك في موقع SLS Freeroom</h1>
</div>

<script>
  const loginForm = document.getElementById('loginForm');
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    // يمكن هنا تنفيذ التحقق أو إرسال البيانات عبر API مثل الكود الأصلي
    // ثم إذا تم التحقق بنجاح نعرض صفحة الموقع ونخفي صفحة الدخول
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('sitePage').style.display = 'block';
  });
</script>
</body>
</html>
