<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>واجهة دخول ديسكورد - مطابقة الصورة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal&display=swap');
  body {
    margin: 0; padding: 0;
    font-family: 'Tajawal', sans-serif;
    direction: rtl;
    background: linear-gradient(135deg, #1f1f44 0%, #2b2e5a 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ddd;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle at 20% 30%, #7f8cff7a, transparent 70%);
    border-radius: 50%;
    filter: blur(80px);
    left: 5%;
    top: 20%;
    z-index: 0;
  }
  body::after {
    content: "";
    position: absolute;
    width: 200px; height: 200px;
    background: radial-gradient(circle at 80% 70%, #9385ff8d, transparent 70%);
    border-radius: 50%;
    filter: blur(50px);
    right: 10%;
    bottom: 20%;
    z-index: 0;
  }
  .login-box {
    position: relative;
    z-index: 1;
    width: 420px;
    background: #2f3136;
    border-radius: 8px;
    display: flex;
    box-shadow: 0 0 8px #7289daaa;
    overflow: hidden;
  }
  .form-section {
    flex-grow: 2;
    padding: 35px 30px;
  }
  .form-section h1 {
    color: #fff;
    margin-bottom: 6px;
    font-weight: 700;
    font-size: 22px;
  }
  .form-section small {
    color: #b9bbbe;
    font-size: 13px;
    margin-bottom: 25px;
    display: block;
  }
  label {
    font-weight: 600;
    font-size: 12px;
    color: #72767d;
    margin: 10px 0 6px;
    display: block;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: #202225;
    border: none;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 14px;
    color: #dcddde;
    outline: none;
  }
  input::placeholder {
    color: #72767d;
  }
  .forgot-password {
    font-size: 11px;
    color: #72767d;
    margin-top: 8px;
    cursor: pointer;
  }
  button {
    width: 100%;
    margin-top: 20px;
    background-color: #5865f2;
    border: none;
    border-radius: 5px;
    color: white;
    padding: 11px 0;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #4752c4;
  }
  .qr-section {
    flex-grow: 1;
    background: #36393f;
    padding: 30px 20px;
    text-align: center;
    color: #b9bbbe;
    border-left: 1px solid #202225;
  }
  .qr-section img {
    width: 110px;
    height: 110px;
    margin-bottom: 15px;
  }
  .qr-section h2 {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 5px;
  }
  .qr-section p {
    font-size: 11px;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="login-box">
  <form class="form-section" id="loginForm">
    <h1>Welcome back!</h1>
    <small>We’re so excited to see you again!</small>

    <label for="email">Email or Phone Number</label>
    <input type="text" id="email" name="email" placeholder="Email or Phone Number" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required />
    
    <div class="forgot-password" onclick="alert('نسيت كلمة السر؟ يمكنك إنشاء حساب جديد');">Forgot your password?</div>
    
    <button type="submit">Log In</button>
  </form>

  <div class="qr-section">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/QR_Code.svg/1024px-QR_Code.svg.png" alt="QR Code" />
    <h2>Log in with QR Code</h2>
    <p>Scan this with the Discord mobile app to log in instantly.</p>
    <p>Or, sign in with passkey.</p>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();
    // إرسال البيانات أو التحقق قبل الدخول هنا
    alert('تم تسجيل الدخول (تتم المحاكاة)');
    // بمجرد تسجيل الدخول، يمكن إظهار محتوى الموقع أو إعادة التوجيه
    // مثلاً هنا إظهار رسالة فقط
  });
</script>
</body>
</html>
