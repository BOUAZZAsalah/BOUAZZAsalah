<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>صفحة دخول وهمية</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #36393f;
      color: #dcddde;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background-color: #2f3136;
      padding: 40px;
      border-radius: 8px;
      width: 400px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      font-size: 14px;
      margin-bottom: 25px;
      color: #b9bbbe;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 4px;
      background-color: #202225;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border: 1px solid #5865f2;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #5865f2;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      background-color: #4752c4;
    }

    .links {
      margin-top: 20px;
      font-size: 13px;
    }

    .links a {
      color: #00aff4;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>مرحباً مجدداً!</h2>
    <p>سجّل الدخول للمتابعة</p>
    <form>
      <input type="email" placeholder="البريد الإلكتروني" required>
      <input type="password" placeholder="كلمة المرور" required>
      <button type="button" class="btn">تسجيل الدخول</button>
    </form>
    <div class="links">
      <p>هل نسيت كلمة المرور؟ <a href="#">إعادة تعيين</a></p>
      <p>ليس لديك حساب؟ <a href="#">التسجيل</a></p>
    </div>
  </div>
</body>
</html>
