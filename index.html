<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تسجيل الدخول - ديسكورد</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap');

  /* الخلفية والهيكل العام */
  body {
    margin: 0;
    background: #2f2f50 url('https://cdn.discordapp.com/attachments/1051691047793315881/1096247187364884846/noname_2.png') center center no-repeat;
    background-size: cover;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }

  /* الحاوية الرئيسية */
  .login-box {
    background: #2f3136;
    border-radius: 8px;
    width: 460px;
    display: flex;
    box-shadow: 0 0 30px rgba(0,0,0,0.7);
  }

  /* صندوق اليسار - حقول تسجيل الدخول */
  .login-form {
    flex: 1.1;
    padding: 30px 40px 35px 40px;
    font-size: 14px;
  }

  .login-form h2 {
    margin-bottom: 10px;
    font-weight: 600;
  }

  .login-form p.subtitle {
    font-size: 12px;
    color: #72767d;
    margin-bottom: 22px;
  }
  
  label {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
    user-select: none;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background-color: #202225;
    border: none;
    border-radius: 5px;
    padding: 12px 14px;
    color: #dcddde;
    font-size: 16px;
    box-sizing: border-box;
    margin-bottom: 15px;
    transition: border 0.3s ease;
  }

  input::placeholder {
    color: #72767d;
  }

  input:focus {
    outline: none;
    border: 2px solid #5865f2;
    background-color: #2a2c2f;
  }

  button {
    width: 100%;
    background: #5865f2;
    color: white;
    padding: 14px;
    font-weight: 600;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    font-size: 16px;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background: #4752c4;
  }

  .links {
    margin-top: 15px;
    font-size: 13px;
    color: #72767d;
  }
  .links a {
    color: #00aff4;
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }

  /* صندوق اليمين - QR كود */
  .qr-box {
    width: 230px;
    background: #36393f;
    border-radius: 8px 0 0 8px;
    padding: 30px 25px 30px 25px;
    box-sizing: border-box;
    text-align: center;
    color: #dcddde;
    font-size: 14px;
  }

  .qr-box h3 {
    margin-bottom: 10px;
    font-weight: 600;
    font-size: 18px;
  }

  .qr-box p {
    font-size: 12px;
    margin-top: 5px;
    margin-bottom: 20px;
    color: #72767d;
  }

  .qr-code {
    background: white;
    width: 140px;
    height: 140px;
    margin: 0 auto 15px auto;
    border-radius: 10px;
  }

  /* نص صغير في الأسفل */
  .terms {
    font-size: 11px;
    color: #72767d;
    margin-top: 12px;
    user-select: none;
  }
</style>
</head>
<body>

<div class="login-box" role="main" aria-label="نموذج تسجيل الدخول">
  <form class="login-form" autocomplete="off">
    <h2>Welcome back!</h2>
    <p class="subtitle">We’re so excited to see you again!</p>
    
    <label for="email">Email or Phone Number</label>
    <input type="text" id="email" placeholder="Email or Phone Number" autocomplete="username" required />
    
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
    
    <button type="submit">Log In</button>

    <div class="links" style="margin-top:12px;">
      <p><a href="#">Forgot your password?</a></p>
      <p>Need an account? <a href="#">Register</a></p>
    </div>

    <p class="terms">© 2025 Discord</p>
  </form>

  <div class="qr-box" aria-label="تسجيل الدخول عبر رمز الاستجابة السريعة">
    <h3>Log in with QR Code</h3>
    <div class="qr-code" aria-hidden="true">
      <!-- يمكنك وضع صورة QR هنا -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://discord.com/login" alt="QR Code" style="width:140px; height:140px; border-radius:10px;" />
    </div>
    <p>Scan this with the Discord mobile app to log in instantly</p>
    <p>Or log in with e-mail and password</p>
  </div>
</div>

</body>
</html>
